# Runs on self-hosted runners.
#
# Two packages, two jobs: the root is the server that drives the installed
# agentry CLI; secureagentry-mcp/ is the registry-API server.
name: ci

on:
  push:
    # dev is the integration branch; main is production.
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job carries the fork guard
#   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
# Every job here runs on a persistent self-hosted runner that shares its host
# and caches with other repositories' jobs. A pull request from a fork would
# otherwise execute its own `run:` steps there. The guard lives in the file,
# where a diff shows it; the repository setting "Require approval for all
# external contributors" stays on as belt-and-braces. A fork's pull request
# shows these jobs as skipped; a maintainer who wants it built pushes its
# commits to a branch here.
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      # The fork-guard check parses the workflows with PyYAML; setup-python
      # brings a clean interpreter, so PyYAML is installed rather than assumed.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3

      - name: No fork-reachable job on a self-hosted runner
        run: npm run workflows-check

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      # Tool descriptions and the instructions are what a host's model reads
      # before it acts: no never-word in a string literal, ever.
      - name: Prose gate
        run: |
          node scripts/prose-check.mjs --self-test
          npm run prose-check

      # The suite takes under a minute; a test that leaves a session's child
      # process open would otherwise hold this repository's runner until the
      # job's own six-hour limit.
      - name: Test
        timeout-minutes: 5
        run: npm test

      # --yes, --allow-unsigned and --allow-unscanned reach the CLI only from
      # a confirm call, so they are spelled only in src/consent.ts.
      - name: Consent flags appear only in the confirm path
        run: |
          if grep -rn -e '--yes' -e '--allow-unsigned' -e '--allow-unscanned' src/ | grep -v 'src/consent.ts'; then
            echo "::error::--yes/--allow-unsigned/--allow-unscanned outside src/consent.ts"; exit 1
          fi
          echo "ok: no consent flag outside the confirm path"

  # The downloadable tarball, built by the same script the
  # release runs, twice, so a change that breaks packaging or makes it
  # irreproducible fails here and not at a tag; then unpacked away from this
  # checkout and started, with no CLI (it must refuse) and with the tests'
  # fake CLI (it must answer initialize and list its tools).
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Package twice and compare
        run: |
          set -euo pipefail
          scripts/package.sh 0.0.0-ci "$RUNNER_TEMP/a"
          scripts/package.sh 0.0.0-ci "$RUNNER_TEMP/b"
          a=$(sha256sum "$RUNNER_TEMP/a/agentry-mcp-0.0.0-ci.tar.gz" | cut -d' ' -f1)
          b=$(sha256sum "$RUNNER_TEMP/b/agentry-mcp-0.0.0-ci.tar.gz" | cut -d' ' -f1)
          [ "$a" = "$b" ] || { echo "::error::two packagings of one commit differ ($a, $b)"; exit 1; }
          echo "reproducible: $a"

      - name: Start the unpacked server
        run: node scripts/package-smoke.mjs "$RUNNER_TEMP/a/agentry-mcp-0.0.0-ci.tar.gz"

  parked:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: secureagentry-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: secureagentry-mcp/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Catalog matches the vendored spec
        run: |
          npm run generate
          git diff --exit-code -- src/catalog.generated.ts \
            || { echo "::error::src/catalog.generated.ts is stale — run 'npm run generate' and commit the result"; exit 1; }

      - name: Test
        run: npm test
