# The MCP server's release (agentry-mcp#32, register DEV-125; the scheme and
# the GitHub Releases of DEV-148, agentry-mcp#48 and #36). A tag is one of two
# forms, and the line its commit is on must agree:
#   vX.Y.Z        on main's first-parent line: a production release;
#   vX.Y.Z-dev.N  on dev's first-parent line: a dev prerelease of the version
#                 main releases next.
# scripts/release-tag.sh (the CLI's, copied unchanged) refuses any other form,
# a form on the wrong line, a release that does not move forward, and any 1.x
# unless the operator has set the repository variable AGENTRY_ALLOW_V1=true
# (agentry#522), before anything is built. package.json's version and
# SERVER_VERSION stay X.Y.Z and the tag names them; the tarball is named for
# the whole tag. The server bakes no registry (it drives the person's own
# agentry CLI, whose release bakes one); BUILD-INFO names the channel.
#
# The package job packages the server as one self-contained tarball
# (scripts/package.sh — the same script CI runs on every pull request),
# starts it unpacked, and writes BUILD-INFO and SHA256SUMS over both. The sign
# job signs the sums with the estate's own update-signing key by the desktop's
# signrelease at a pinned commit (which verifies what it wrote against the
# committed key set) when the `release` environment holds its two secrets
# (agentry-mcp#33), and otherwise passes the bundle on unsigned and says so:
# sign where signing exists, release unsigned where it does not (DEV-148).
# Once the secrets exist, the repository variable AGENTRY_REQUIRE_SIGNING=true
# makes a missing one fail the release. Every tag then publishes a GitHub
# Release with the bundle (the publish job): a -dev.N tag's is a prerelease, a
# vX.Y.Z tag's a full release, a minor or major (X.Y.0) a draft for the
# operator to approve its notes. No npm publish.
#
# Two jobs hold what they must and nothing else, because the key is the
# desktop's own update key (D-026): `package` runs npm and the repository's
# code and holds no secret; `sign` checks out nothing, runs no npm, and is the
# only job in the `release` environment. Every npm ci here runs with
# --ignore-scripts besides.
#
# The tarball is JavaScript for every platform, so there is no OS signature to
# make: the estate's signature over SHA256SUMS is the whole provenance, and
# BUILD-INFO says signed=false in the site's grammar (an OS code signature).
#
# workflow_dispatch runs the same jobs as a dry run, named by git describe; it
# signs exactly as a tag does, publishes no Release, and the site's importer
# refuses its bundle by event=. Nothing in the tree's build or tests needs any
# of this: npm run check and scripts/package.sh work with no token and no
# signing tool.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, never cancelled by a later one: a release in flight
# finishes or fails on its own account.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # The desktop COMMIT whose internal/cmd/signrelease signs this bundle and
  # whose internal/selfupdate/keys.json is the key set the signature is
  # verified against before upload — the same key set the site's importer
  # checks. The CLI pins the same commit. When the desktop rotates or retires
  # a key (agentry-desktop#111), this pin and the release environment's
  # AGENTRY_UPDATE_SIGNING_KEY move together (scripts/operator/release-setup.sh
  # reloads the secret); either alone fails the next release closed.
  DESKTOP_SIGNRELEASE_REF: c4b13867dd9fc9783f5daf9438e964e5d7fce05d

jobs:
  # Everything that runs npm or this repository's code. It holds no secret.
  package:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      latest: ${{ steps.tag.outputs.latest }}
      draft: ${{ steps.tag.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # A tag is vX.Y.Z on main's first-parent line or vX.Y.Z-dev.N on dev's,
      # releases only move forward, and a 1.x waits for the operator.
      - name: The tag, its line and what it releases
        id: tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          AGENTRY_ALLOW_V1: ${{ vars.AGENTRY_ALLOW_V1 }}
        run: |
          set -euo pipefail
          if ! out=$(scripts/release-tag.sh check "$TAG" "$GITHUB_SHA" 2>"$RUNNER_TEMP/tag-check.err"); then
            echo "::error::$(cat "$RUNNER_TEMP/tag-check.err")"; exit 1
          fi
          printf '%s\n' "$out"
          grep -E '^(prerelease|latest|draft)=' <<<"$out" >> "$GITHUB_OUTPUT"
      # The channel, from the commit's line (a dry run's too): production for
      # main's first-parent line, dev for dev's, refused for any other commit.
      - name: The channel this release is for
        id: channel
        run: |
          set -euo pipefail
          out=$(scripts/release-registry.sh "${GITHUB_SHA}")
          c=$(sed -n 's/^AGENTRY_RELEASE_CHANNEL=//p' <<<"$out")
          echo "channel=$c" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_SHA} is a $c release"
      # The version is the tag's (describe names one of several tags on a
      # commit). package.json and SERVER_VERSION must both say its X.Y.Z, or a
      # person's host would show one number and the file another.
      - name: The version this release is named for
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${TAG#v}"
            xyz="${v%-dev.*}"
            pkg=$(node -p 'require("./package.json").version')
            [ "$pkg" = "$xyz" ] || { echo "::error::package.json says $pkg, the tag names $xyz"; exit 1; }
            grep -F "SERVER_VERSION = \"$xyz\";" src/server.ts >/dev/null \
              || { echo "::error::src/server.ts's SERVER_VERSION is not \"$xyz\""; exit 1; }
          else
            v=$(git describe --tags --always 2>/dev/null | sed 's/^v//')
            [[ $v =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]] || { echo "::error::git describe gave '$v', not a version name"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v (${GITHUB_EVENT_NAME} on ${GITHUB_REF})"
      # The gate CI runs, again, on the tagged commit: a tag on a commit whose
      # checks were never green does not ship.
      - name: npm run check
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: The tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package.sh "$VERSION" dist-release
      - name: Start the unpacked server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # The server reports SERVER_VERSION, the tag's X.Y.Z.
            node scripts/package-smoke.mjs "dist-release/agentry-mcp-$VERSION.tar.gz" --expect-version "${VERSION%-dev.*}"
          else
            node scripts/package-smoke.mjs "dist-release/agentry-mcp-$VERSION.tar.gz"
          fi
      - name: BUILD-INFO and SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp "dist-release/agentry-mcp-$VERSION.tar.gz" bundle/
          {
            echo "product=agentry-mcp"
            echo "version=$VERSION"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "channel=${CHANNEL}"
            echo "node=$(node --version)"
            # The site's grammar: an OS code signature, which a tarball of
            # JavaScript does not carry. The estate's signature is the .minisig.
            echo "signed=false"
            echo "built_by=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > bundle/BUILD-INFO
          cat bundle/BUILD-INFO
          cd bundle
          sha256sum agentry-mcp-* BUILD-INFO > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-agentry-mcp-${{ steps.version.outputs.version }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1

  # The only job that sees the key. No checkout, no npm, no code of this
  # repository: it takes the bundle, checks it, signs it, uploads it.
  sign:
    needs: package
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    # The `release` environment admits only main and v* tags, and both secrets
    # below are its own, so no other ref's job can read them.
    environment: release
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-agentry-mcp-${{ needs.package.outputs.version }}
          path: bundle
      - name: The bundle is what package wrote
        run: |
          set -euo pipefail
          cd bundle
          sha256sum -c SHA256SUMS
          [ "$(ls | sort | tr '\n' ' ')" = "BUILD-INFO SHA256SUMS agentry-mcp-$VERSION.tar.gz " ] \
            || { echo "::error::the bundle holds $(ls | tr '\n' ' ')"; exit 1; }
          grep -qx "version=$VERSION" BUILD-INFO && grep -qx "commit=${GITHUB_SHA}" BUILD-INFO \
            || { echo "::error::BUILD-INFO is not this run's"; exit 1; }
      # What this environment can sign with today (agentry-mcp#33): both
      # secrets or neither. Half a configuration is a mistake, not
      # "unavailable", and fails; so does a missing one once the operator has
      # set AGENTRY_REQUIRE_SIGNING=true.
      - name: What can be signed here
        id: signing
        env:
          HAS_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN != '' }}
          HAS_SIGNING_KEY: ${{ secrets.AGENTRY_UPDATE_SIGNING_KEY != '' }}
          REQUIRE_SIGNING: ${{ vars.AGENTRY_REQUIRE_SIGNING }}
        run: |
          set -euo pipefail
          case "$HAS_BUILD_TOKEN/$HAS_SIGNING_KEY" in
            true/true) echo "sums=sign" >> "$GITHUB_OUTPUT"; echo "SHA256SUMS: the estate's update-signing key" ;;
            false/false)
              [ "$REQUIRE_SIGNING" != true ] || { echo "::error::AGENTRY_REQUIRE_SIGNING is true and the release environment holds neither signing secret (agentry-mcp#33)"; exit 1; }
              echo "sums=none" >> "$GITHUB_OUTPUT"
              echo "::warning::The release environment holds neither AGENTRY_BUILD_TOKEN nor AGENTRY_UPDATE_SIGNING_KEY (agentry-mcp#33): this release ships unsigned, with no SHA256SUMS.minisig, and its Release says so." ;;
            *) echo "::error::The release environment holds only one of AGENTRY_BUILD_TOKEN and AGENTRY_UPDATE_SIGNING_KEY: set both (scripts/operator/release-setup.sh, agentry-mcp#33) or neither."; exit 1 ;;
          esac
      - uses: actions/setup-go@v5
        if: steps.signing.outputs.sums == 'sign'
        with:
          go-version: "1.27.0"
          # Shared persistent host module cache; restoring the Actions cache
          # over it left partial modules in the core (agentry#225).
          cache: false
      # Job-scoped on this persistent runner, removed at the end: the token
      # reaches a file the job deletes, not the runner's global git config. It
      # exists for one thing, resolving the private desktop module the signer
      # is installed from.
      - name: Authenticate for the private blaktron modules (job-scoped)
        if: steps.signing.outputs.sums == 'sign'
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: The desktop's signrelease at the pinned commit
        if: steps.signing.outputs.sums == 'sign'
        run: GOBIN="$RUNNER_TEMP" GOWORK=off go install "github.com/blaktron/agentry-desktop/internal/cmd/signrelease@${DESKTOP_SIGNRELEASE_REF}"
      # The private half is an environment secret, piped to the signer on
      # stdin, never written to disk, dropped from the signer's own
      # environment (agentry-desktop D-026). -product agentry-mcp: the signed
      # trusted comment names this product, and the signer refuses sums whose
      # artifact names do not carry it, so this bundle can never be offered to
      # the desktop as an update of itself.
      - name: Sign SHA256SUMS with the estate's update-signing key
        if: steps.signing.outputs.sums == 'sign'
        env:
          AGENTRY_UPDATE_SIGNING_KEY: ${{ secrets.AGENTRY_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "${AGENTRY_UPDATE_SIGNING_KEY}" \
            | env -u AGENTRY_UPDATE_SIGNING_KEY "$RUNNER_TEMP/signrelease" \
                -key - \
                -in bundle/SHA256SUMS \
                -product agentry-mcp \
                -version "$VERSION" \
                -commit "${GITHUB_SHA}"
          cat bundle/SHA256SUMS.minisig
      - name: Remove the signing binary and the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/signrelease" "$RUNNER_TEMP/gitconfig"
      - uses: actions/upload-artifact@v4
        with:
          name: agentry-mcp-${{ needs.package.outputs.version }}
          path: bundle/
          if-no-files-found: error
          retention-days: 90

  # The GitHub Release (agentry-mcp#36, DEV-148): every tag, never a dry run.
  # The bundle exactly as built and summed, signed when the sign job could;
  # notes generated from the commits under a header that says which. A minor
  # or major release (X.Y.0) is a draft until the operator approves its notes.
  publish:
    needs: [package, sign]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      # Into this job's own temporary directory: the self-hosted runner keeps
      # its workspace between jobs, and a bundle/ left by an earlier release
      # there would ride along into files: below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentry-mcp-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/bundle
      - name: The notes' header
        env:
          CHANNEL: ${{ needs.package.outputs.channel }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
          DRAFT: ${{ needs.package.outputs.draft }}
        run: |
          set -euo pipefail
          b="$RUNNER_TEMP/bundle"
          info() { sed -n "s/^$1=//p" "$b/BUILD-INFO"; }
          [ "$(info version)" = "$VERSION" ] || { echo "::error::BUILD-INFO names $(info version), not $VERSION"; exit 1; }
          case "$(info channel)/$PRERELEASE" in production/false|dev/true) ;; *) echo "::error::BUILD-INFO channel=$(info channel) with prerelease=$PRERELEASE"; exit 1 ;; esac
          (cd "$b" && sha256sum -c SHA256SUMS)
          listed=$(awk '{print $2}' "$b/SHA256SUMS")
          extra=$(cd "$b" && for f in *; do case "$f" in SHA256SUMS|SHA256SUMS.minisig) ;; *) grep -Fx -- "$f" <<<"$listed" >/dev/null || echo "$f" ;; esac; done)
          [ -z "$extra" ] || { echo "::error::files the sums do not cover: $extra"; exit 1; }
          if [ -f "$b/SHA256SUMS.minisig" ]; then
            sumsl="signed with the estate's update-signing key: \`SHA256SUMS.minisig\`, checked against the key set in agentry-desktop's \`internal/selfupdate/keys.json\`"
          else
            sumsl="not signed: the release environment holds no signing key yet (agentry-mcp#33), so there is no \`SHA256SUMS.minisig\`"
          fi
          case "$CHANNEL" in
            production) what="A production release of the Agentry MCP server." ;;
            *) what="A dev prerelease of the Agentry MCP server, for testing on dev." ;;
          esac
          {
            echo "$what It drives the person's own \`agentry\` CLI (0.6.0 or newer), which chooses the registry."
            echo
            echo "**Signatures** (DEV-148: signed where signing exists, unsigned where it does not):"
            echo "- \`SHA256SUMS\`: $sumsl."
            echo "- The tarball is JavaScript for every platform and carries no OS signature."
            echo
            echo "Check the download against the sums: \`sha256sum -c --ignore-missing SHA256SUMS\`. \`BUILD-INFO\` (covered by the sums) records the commit, the channel and the Node version it was built with."
            [ "$DRAFT" = true ] && { echo; echo "_A minor release: drafted for the operator to approve these notes and publish._"; }
            echo
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: The GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: agentry-mcp ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: ${{ runner.temp }}/bundle/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.package.outputs.prerelease }}
          draft: ${{ needs.package.outputs.draft }}
          make_latest: ${{ needs.package.outputs.latest }}
